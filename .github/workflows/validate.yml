name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Validate JSON
        run: |
          python3 -m json.tool .claude-plugin/marketplace.json > /dev/null
          python3 -m json.tool plugin/.claude-plugin/plugin.json > /dev/null
          python3 -m json.tool plugin/hooks/hooks.json > /dev/null

      - name: Check shell syntax
        run: |
          for f in plugin/hooks-handlers/*.sh; do
            bash -n "$f"
          done

      - name: Run tests
        run: |
          git config --global user.name "Continuity CI"
          git config --global user.email "ci@example.invalid"
          bash tests/run-all.sh

      - name: Validate Claude Code plugin
        run: npx -y @anthropic-ai/claude-code@2.1.231 plugin validate plugin --strict
